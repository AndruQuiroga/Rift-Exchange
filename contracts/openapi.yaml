openapi: 3.1.0
info:
  title: Rift Exchange — private fictional-credit prediction API
  version: 0.1.0
  description: |
    Design contract, not a deployed server. All odds and match data in examples are synthetic.
    Virtual nonredeemable credits only. No production betting integration without policy approval.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Game
  - name: Tickets
  - name: League
  - name: Admin
paths:
  /season/current:
    get:
      tags: [Game]
      operationId: currentSeason
      responses:
        '200':
          description: Active season
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Season' }
  /events:
    get:
      tags: [Game]
      operationId: listEvents
      parameters:
        - in: query
          name: date
          schema: { type: string, format: date }
        - in: query
          name: stage
          schema: { type: string }
      responses:
        '200':
          description: Event slate
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Event' } }
  /events/{eventId}:
    get:
      tags: [Game]
      operationId: getEvent
      parameters:
        - { in: path, name: eventId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '404': { $ref: '#/components/responses/NotFound' }
  /markets:
    get:
      tags: [Game]
      operationId: listMarkets
      parameters:
        - { in: query, name: fixture_id, schema: { type: string, format: uuid } }
        - { in: query, name: category, schema: { type: string } }
      responses:
        '200':
          description: Markets with current odds
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Market' } }
  /me/wallet:
    get:
      tags: [Game]
      operationId: getWallet
      responses:
        '200':
          description: Wallet balances are server-authoritative
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
  /me/tickets:
    get:
      tags: [Tickets]
      operationId: listMyTickets
      parameters:
        - in: query
          name: state
          schema: { type: string, enum: [OPEN, SETTLED, ALL] }
      responses:
        '200':
          description: Current user's tickets only
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Ticket' } }
  /quotes:
    post:
      tags: [Tickets]
      operationId: createQuote
      description: Non-binding quote; odds may change before acceptance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    type: object
                    required: [outcome_id, stake_rc]
                    properties:
                      outcome_id: { type: string, format: uuid }
                      stake_rc: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Price-locked only until quote expiry/market revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tickets:
    post:
      tags: [Tickets]
      operationId: acceptTicket
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id, confirm_odds_versions]
              properties:
                quote_id: { type: string, format: uuid }
                confirm_odds_versions:
                  type: object
                  additionalProperties: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Accepted ticket; atomic stake debit occurred
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '200':
          description: Existing ticket on idempotent retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '409': { $ref: '#/components/responses/Conflict' }
  /league/standings:
    get:
      tags: [League]
      operationId: listStandings
      responses:
        '200':
          description: Provisional balances with separate locked stakes
          content:
            application/json:
              schema:
                type: object
                properties:
                  provisional: { type: boolean }
                  members: { type: array, items: { $ref: '#/components/schemas/MemberStanding' } }
  /league/activity:
    get:
      tags: [League]
      operationId: listActivity
      description: Do not reveal another member's pre-lock selections.
      responses:
        '200':
          description: Friend activity after respective lock
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }
  /admin/results/inbox:
    get:
      tags: [Admin]
      operationId: resultsInbox
      responses:
        '200': { description: Authenticated admin queue }
        '403': { description: Forbidden }
  /admin/settlements/{id}/preview:
    post:
      tags: [Admin]
      operationId: settlementPreview
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Read-only grading/delta preview }
        '403': { description: Forbidden }
  /admin/settlements/{id}/execute:
    post:
      tags: [Admin]
      operationId: executeSettlement
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        '200': { description: Graded atomically or previously applied }
        '403': { description: Forbidden }
        '409': { $ref: '#/components/responses/Conflict' }
  /stream:
    get:
      tags: [Game]
      operationId: eventStream
      responses:
        '200':
          description: Scoped server-sent event invalidation hints
          content:
            text/event-stream:
              schema: { type: string }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: rx_session
      description: Example only; writes also require an anti-CSRF defense.
  schemas:
    Season:
      type: object
      required: [id, title, status, opening_grant_rc, match_day_grant_rc]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [DRAFT, OPEN, FROZEN, ARCHIVED] }
        opening_grant_rc: { type: integer, format: int64 }
        match_day_grant_rc: { type: integer, format: int64 }
        timezone: { type: string, example: America/Chicago }
    Event:
      type: object
      required: [id, stage, best_of, scheduled_start_at, state]
      properties:
        id: { type: string, format: uuid }
        stage: { type: string, example: SWISS }
        best_of: { type: integer, enum: [1,3,5] }
        team_a: { type: string }
        team_b: { type: string }
        scheduled_start_at: { type: string, format: date-time }
        state: { type: string, enum: [SCHEDULED, DRAFTING, LIVE, POSTPONED, COMPLETED, CANCELED] }
    Market:
      type: object
      required: [id, kind, label, scope, close_at, state, outcomes, rule_version]
      properties:
        id: { type: string, format: uuid }
        fixture_id: { type: string, format: uuid }
        kind: { type: string }
        label: { type: string }
        scope: { type: string, enum: [GAME, SERIES, MATCH_DAY, STAGE, TOURNAMENT] }
        close_at: { type: string, format: date-time }
        state: { type: string, enum: [DRAFT, OPEN, SUSPENDED, LOCKED, GRADING, SETTLED, VOID] }
        rule_version: { type: integer }
        settlement_summary: { type: string }
        outcomes:
          type: array
          items: { $ref: '#/components/schemas/Outcome' }
    Outcome:
      type: object
      required: [id, label, odds, odds_version]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        odds: { type: string, pattern: '^[0-9]+\.[0-9]{2,4}$', example: '2.40' }
        odds_version: { type: integer, minimum: 1 }
    Wallet:
      type: object
      required: [available_rc, open_stake_rc, total_grants_rc, recovery_due_rc]
      properties:
        available_rc: { type: integer, format: int64, minimum: 0 }
        open_stake_rc: { type: integer, format: int64, minimum: 0 }
        total_grants_rc: { type: integer, format: int64, minimum: 0 }
        recovery_due_rc: { type: integer, format: int64, minimum: 0 }
    Quote:
      type: object
      required: [quote_id, expires_at, items, total_stake_rc, available_after_rc]
      properties:
        quote_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        total_stake_rc: { type: integer, format: int64 }
        available_after_rc: { type: integer, format: int64 }
        conditional_return_if_all_win_rc: { type: integer, format: int64 }
        items:
          type: array
          items:
            type: object
            properties:
              outcome_id: { type: string, format: uuid }
              stake_rc: { type: integer, format: int64 }
              odds: { type: string }
              odds_version: { type: integer }
              potential_return_rc: { type: integer, format: int64 }
    Ticket:
      type: object
      required: [ticket_id, accepted_at, selections, total_stake_rc]
      properties:
        ticket_id: { type: string, format: uuid }
        accepted_at: { type: string, format: date-time }
        total_stake_rc: { type: integer, format: int64 }
        selections:
          type: array
          items:
            type: object
            properties:
              outcome_id: { type: string, format: uuid }
              stake_rc: { type: integer, format: int64 }
              accepted_odds: { type: string }
              potential_return_rc: { type: integer, format: int64 }
              state: { type: string, enum: [OPEN, HOLD, WON, LOST, VOID, CORRECTED] }
    MemberStanding:
      type: object
      properties:
        handle: { type: string }
        display_name: { type: string }
        available_rc: { type: integer, format: int64 }
        open_stake_rc: { type: integer, format: int64 }
        realized_profit_rc: { type: integer, format: int64 }
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: ODDS_CHANGED }
            message: { type: string }
            request_id: { type: string }
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Business-rule conflict (quote changed, expired, closed, insufficient credits)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
