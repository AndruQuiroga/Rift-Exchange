    <div class="sidebar-foot"><b><span class="dot"></span> Private league · 3 friends</b><p>Big reads. Wild calls. One shared leaderboard.</p><div class="userpic"><span class="avatar">Y</span> You <span style="margin-left:auto;color:#a6c1ce">PLAYER</span></div></div>
  </aside>
  <main class="main" id="main-view" tabindex="-1"></main>
  <aside class="rail" aria-label="Selected predictions"><div class="rail-top"><h2>Your slip</h2><span class="counter" id="rail-counter">0</span></div><div id="rail-body"></div></aside>
</div>
<nav class="mobile-nav" id="mobile-menu" aria-label="Mobile navigation"></nav>
<button id="mobile-slip" class="float-slip hidden" aria-label="Review selected predictions"></button>
<div id="sheet-bg" class="sheet-bg" aria-hidden="true"></div>
<section class="sheet" id="sheet" role="dialog" aria-label="Your predictions slip" aria-modal="true" aria-hidden="true"><div class="sheet-handle"></div><div class="sheet-top"><h2>Your slip</h2><button type="button" id="close-sheet" aria-label="Close slip">✕</button></div><div id="sheet-body" style="display:flex;flex-direction:column;min-height:0;flex:1"></div></section>
<div class="toast" role="status" aria-live="polite" id="toast"></div>
<script>
(() => {
  'use strict';
  const KEY='rift-exchange-demo-v2';
  const ico={today:'◉',explore:'⌕',picks:'▣',league:'♛',profile:'◷'};
  const pages=[['today','Today'],['explore','Explore'],['picks','My Picks'],['league','League'],['profile','Profile']];
  // All fixtures and odds below are fictional teaching fixtures. Never label as real Worlds slate.
  const events=[
    {id:'a',a:'ATLAS',b:'NOVA',aRegion:'NORTH',bRegion:'EAST',aColor:'gold',bColor:'violet',bestOf:3,time:'12:00 PM',short:'Swiss · Demo Series A',timeTag:'FRI 23 OCT'},
    {id:'b',a:'EMBER',b:'ION',aRegion:'WEST',bRegion:'SOUTH',aColor:'violet',bColor:'',bestOf:1,time:'2:30 PM',short:'Swiss · Demo Series B',timeTag:'FRI 23 OCT'},
    {id:'c',a:'ORBIT',b:'CROWN',aRegion:'NORTH',bRegion:'WEST',aColor:'',bColor:'gold',bestOf:5,time:'4:30 PM',short:'Knockouts · Demo Series C',timeTag:'SAT 14 NOV'}
  ];
  const markets=[
    {id:'a-win',e:'a',cat:'Winners',label:'Series winner',rules:'Settles on the official series winner. Best-of-three.',outcomes:[['Atlas wins',1.62],['Nova wins',2.40]]},
    {id:'a-score',e:'a',cat:'Winners',label:'Exact series score',rules:'Only the exact winning team and final 2–0 / 2–1 series score wins.',outcomes:[['Atlas 2–0',2.80],['Atlas 2–1',3.60],['Nova 2–0',4.80],['Nova 2–1',4.10]]},
    {id:'a-pick',e:'a',cat:'Draft',label:'Will Orianna be picked in Game 1?',rules:'Yes if Orianna appears in the confirmed Game 1 draft picks. Locked before draft.',outcomes:[['Yes',1.92],['No',1.91]]},
    {id:'a-bans',e:'a',cat:'Draft',label:'Most-banned champion of the day',rules:'Champion with strictly the most confirmed bans across the stated day; tied-first void.',outcomes:[['Azir',3.40],['Rumble',4.20],['Varus',5.50]]},
    {id:'a-kills',e:'a',cat:'Players',label:'Most kills · Game 1',rules:'Highest kills among all ten players in Game 1. A tie for first voids.',outcomes:[['Mid laner',3.30],['Bot laner',2.85],['Jungler',4.20]]},
    {id:'b-win',e:'b',cat:'Winners',label:'Match winner',rules:'Winner of a single best-of-one game.',outcomes:[['Ember wins',2.05],['Ion wins',1.79]]},
    {id:'b-first',e:'b',cat:'Players',label:'First blood team',rules:'Confirmed first blood credited to Ember or Ion; unverified prop is held.',outcomes:[['Ember',2.08],['Ion',1.78]]},
    {id:'c-win',e:'c',cat:'Winners',label:'Series winner',rules:'Best-of-five series winner; the scheduled date is demo-only.',outcomes:[['Orbit wins',1.48],['Crown wins',2.78]]},
    {id:'c-score',e:'c',cat:'Winners',label:'Will it go to five games?',rules:'Yes if five games are completed in this Bo5; otherwise No.',outcomes:[['Yes',2.12],['No',1.76]]},
    {id:'c-penta',e:'c',cat:'Players',label:'Pentakill occurs',rules:'Yes if any eligible player records a confirmed pentakill during the series.',outcomes:[['Yes',11.00],['No',1.06]]},
    {id:'future',e:'a',cat:'Futures',label:'Which fictional team takes the trophy?',rules:'This is an original-IP demo futures question. Outcome determined at season end.',outcomes:[['Atlas',4.80],['Nova',7.50],['Crown',5.30],['Orbit',3.60]]}
  ];
  const index=new Map(markets.flatMap(m=>m.outcomes.map((o,i)=>[m.id+'-'+i,{id:m.id+'-'+i,m,oi:i,name:o[0],odds:o[1],ev:events.find(e=>e.id===m.e)}])));
  const initial=()=>({view:'today',category:'All',available:2000,grants:2000,slip:{},tickets:[],ledger:[{id:'l-1',label:'Opening grant',delta:1000,when:'Season start'},{id:'l-2',label:'Swiss match-day grant',delta:1000,when:'Oct 23'}],nextClaimed:false});
  let state;try{state={...initial(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=initial()}
  let sheetOpen=false,filter='All',toastTimer;
  const money=n=>Math.round(n).toLocaleString('en-US');
  const odds=n=>Number(n).toFixed(2)+'×';
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};
  const validSlip=()=>Object.entries(state.slip).filter(([id,s])=>index.has(id)&&Number(s)>=0);
  const slipStake=()=>validSlip().reduce((a,[,s])=>a+(Number(s)||0),0);
  const slipPotential=()=>validSlip().reduce((a,[id,s])=>a+Math.round(Number(s)*index.get(id).odds),0);
  const openStakes=()=>state.tickets.filter(t=>t.state==='OPEN').reduce((a,t)=>a+t.stake,0);
  const toast=(msg)=>{const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2700)};
  const navHtml=mobile=>pages.map(([id,label])=>`<button type="button" data-view="${id}" class="${mobile?'':'nav-btn '}${id===state.view?'active':''}" aria-current="${id===state.view?'page':'false'}"><span class="ico" aria-hidden="true">${ico[id]}</span><span>${label}</span></button>`).join('');
  function renderNav(){document.getElementById('side-menu').innerHTML=navHtml(false);document.getElementById('mobile-menu').innerHTML=navHtml(true)}
  function topbar(){return `<div class="topline"><span class="desktop-kicker">✦ WORLDS-INSPIRED / SEASON 2026</span><div class="topline-right"><span class="demo-tag">● DEMO DATA</span><span class="round-pill">3 members · Private</span></div></div>`}
  function walletHero(){return `<section class="hero" aria-label="Your virtual credits"><div class="hero-head"><span class="overline">AVAILABLE RIFT CREDITS</span><span class="grant-badge">↗ +1,000 / MATCH DAY</span></div><div class="hero-value"><b class="num">${money(state.available)}</b><span>RC</span></div><p class="hero-sub">Keep what you win. Save it, spread it, or go all in.</p><div class="hero-bottom"><div class="metric">Open stakes<strong class="num">${money(openStakes())} RC</strong></div><div class="metric">Credits granted<strong class="num">${money(state.grants)} RC</strong></div><button class="hero-link" data-view="profile">View wallet ↗</button></div></section>`}
  function oddsButtons(m,count=0){const subset=count?m.outcomes.slice(0,count):m.outcomes;return `<div class="odds-grid ${subset.length===3?'tri':''}" role="group" aria-label="${esc(m.label)}">${subset.map(([label,price],i)=>{const id=m.id+'-'+i;const chosen=Object.hasOwn(state.slip,id);return `<button type="button" class="odds-btn ${chosen?'selected':''}" data-outcome="${id}" aria-pressed="${chosen}"><span class="outcome-name">${esc(label)}</span><strong class="num">${odds(price)}</strong></button>`}).join('')}</div>`}
  function team(e,key,reverse=false){const name=e[key],region=e[key+'Region'],color=e[key+'Color'];return `<div class="team ${reverse?'right':''}">${reverse?`<div class="team-name"><b>${name}</b><span>${region}</span></div>`:''}<div class="team-symbol ${color}">${name.slice(0,2)}</div>${!reverse?`<div class="team-name"><b>${name}</b><span>${region}</span></div>`:''}</div>`}
  function eventCard(e){const win=markets.find(m=>m.e===e.id&&m.id.endsWith('win'));return `<article class="event-card"><div class="event-top"><span class="pill"><span class="dot"></span>${esc(e.short.toUpperCase())} <span class="format">BO${e.bestOf}</span></span><span class="event-time">${e.timeTag} · ${e.time}</span></div><div class="teams">${team(e,'a')}<span class="versus">VS</span>${team(e,'b',true)}</div><div class="market-caption"><h3>${esc(win.label)}</h3><small>PRE-EVENT ODDS</small></div>${oddsButtons(win)}<button type="button" class="more-market" data-event="${e.id}">Explore ${markets.filter(m=>m.e===e.id).length} markets →</button></article>`}
  function today(){return `${topbar()}<div class="greet">The slate is yours<span style="color:var(--lime)">.</span></div><p class="intro">Three friends. Infinite confidence. Fictional credits, very real bragging rights.</p>${walletHero()}<div class="section-head"><div><h2>Featured matchups</h2><p>Original-IP fixtures and illustrative prices</p></div><button class="text-link" data-view="explore">All markets →</button></div><div class="tabs" role="group" aria-label="Market category">${['All','Winners','Draft','Players','Futures'].map(x=>`<button class="tab ${filter===x?'active':''}" data-filter="${x}" aria-pressed="${filter===x}">${x}</button>`).join('')}</div>${filter==='All'||filter==='Winners'?`<div class="event-stack">${events.slice(0,2).map(eventCard).join('')}</div>`:`<div>${markets.filter(m=>m.cat===filter).slice(0,4).map(marketCard).join('')}</div>`}<div style="height:25px"></div><div class="section-head"><div><h2>Beyond the winner</h2><p>More ways to call your shot.</p></div></div><div class="featured"><div class="feature-card draft"><span class="overline" style="color:#cbafe0">THE DRAFT ROOM</span><div class="small-title">Predict the picks.</div><p>Meta reads, pocket picks, and champion bans.</p><button data-go-category="Draft">Explore draft →</button></div><div class="feature-card"><span class="overline" style="color:#a7ceba">THE LONG GAME</span><div class="small-title">Call the champion.</div><p>A big result weeks from now could change the league.</p><button data-go-category="Futures">Explore futures →</button></div></div><div class="demo-note">All teams, matchups, quotes, results and scores shown here are synthetic. This is an interactive offline UX prototype, not a live event or official betting service.</div>`}
  function marketCard(m){const e=events.find(e=>e.id===m.e);return `<article class="market-item"><div class="market-context">${esc(m.cat.toUpperCase())} · ${esc(e.a)} VS ${esc(e.b)} · BO${e.bestOf}</div><h3 class="market-title">${esc(m.label)}</h3>${oddsButtons(m)}<p class="market-footnote">ⓘ ${esc(m.rules)}</p></article>`}
  function explore(){const cats=['All','Winners','Draft','Players','Futures'];const shown=markets.filter(m=>state.category==='All'||m.cat===state.category);return `${topbar()}<header class="page-heading"><h1>Explore markets<span style="color:var(--lime)">.</span></h1><p>Every selection has a precise scope, a fixed offered multiplier, and transparent rules.</p></header><div class="tabs" role="group" aria-label="Filter markets">${cats.map(x=>`<button class="tab ${state.category===x?'active':''}" data-category="${x}" aria-pressed="${state.category===x}">${x}</button>`).join('')}</div><div class="event-stack">${shown.map(marketCard).join('')}</div>`}
  function emptyPicks(){return `<div class="no-results">No placed predictions yet.<br>Find a matchup, pick an outcome, and submit your demo slip.<p style="margin-top:12px"><button class="secondary" data-view="today">Browse the slate</button></p></div>`}
  function ticketCard(t){const d=index.get(t.id),returnRc=t.state==='WON'?t.returnRc:0;return `<article class="ticket-card"><div class="ticket-head"><span class="overline">${t.when}</span><span class="state-chip ${t.state==='OPEN'?'open':t.state==='LOST'?'lost':''}">${t.state==='OPEN'?'AWAITING RESULT':t.state==='WON'?'✓ WON':'✕ LOST'}</span></div><div class="ticket-title">${esc(d?.m.label||'Selection')} · ${esc(d?.name||t.id)}</div><div class="ticket-meta">${esc(d?.ev.a||'—')} vs ${esc(d?.ev.b||'—')} · Accepted at ${odds(t.odds)} · Fictional event</div><div class="ticket-nums"><div>Stake<strong class="num">${money(t.stake)} RC</strong></div><div>${t.state==='OPEN'?'If correct':'Returned'}<strong class="num">${money(t.state==='OPEN'?Math.round(t.stake*t.odds):returnRc)} RC</strong></div><div>${t.state==='OPEN'?'Net if won':'Net'}<strong class="num ${t.state==='WON'?'positive':''}">${t.state==='OPEN'?'+':''}${money(t.state==='OPEN'?Math.round(t.stake*t.odds)-t.stake: returnRc-t.stake)} RC</strong></div></div>${t.state==='OPEN'?`<div class="ticket-actions"><button class="small-button" data-settle="${t.ticketId}" data-grade="WON">Demo: mark win</button><button class="small-button" data-settle="${t.ticketId}" data-grade="LOST">Demo: mark loss</button></div>`:''}</article>`}
  function picks(){const open=state.tickets.filter(t=>t.state==='OPEN').length;const closed=state.tickets.length-open;return `${topbar()}<header class="page-heading"><h1>My picks<span style="color:var(--lime)">.</span></h1><p>Your active positions are at risk, not part of your available balance.</p></header><div class="insight-grid"><div class="insight"><span class="label">Open exposure</span><strong>${money(openStakes())} <small>RC</small></strong></div><div class="insight"><span class="label">Settled predictions</span><strong>${closed}</strong></div></div><div class="portfolio-tabs"><button class="tab ${!state.pickFilter||state.pickFilter==='OPEN'?'active':''}" data-pick-filter="OPEN">Open · ${open}</button><button class="tab ${state.pickFilter==='SETTLED'?'active':''}" data-pick-filter="SETTLED">Settled · ${closed}</button></div><div>${(state.tickets.filter(t=>state.pickFilter==='SETTLED'?t.state!=='OPEN':t.state==='OPEN').length?state.tickets.filter(t=>state.pickFilter==='SETTLED'?t.state!=='OPEN':t.state==='OPEN').slice().reverse().map(ticketCard).join(''):emptyPicks())}</div><div class="demo-note" style="margin-top:18px">Mock settlement controls appear on open tickets to demonstrate the UI. Production settlement must be based on verified result data with an audit trail; friends cannot grade their own selections.</div>`}
  function league(){const rows=[{name:'You',handle:'RIFT CAPTAIN',bal:state.available,open:openStakes(),av:'Y',cls:''},{name:'Kai',handle:'CHALLENGER',bal:2430,open:900,av:'K',cls:'alt'},{name:'Mika',handle:'CONTENDER',bal:1850,open:1200,av:'M',cls:'third'}].sort((a,b)=>b.bal-a.bal);return `${topbar()}<header class="page-heading"><h1>The league<span style="color:var(--lime)">.</span></h1><p>Three competitors. One champion. Standings are provisional until every market is settled.</p></header><div class="wide-card"><div class="section-head"><div><span class="overline">SEASON 2026</span><h2 style="margin-top:7px">Current standings</h2></div><span class="state-chip open">PROVISIONAL</span></div>${rows.map((r,i)=>`<div class="leader-row"><div class="rank">0${i+1}</div><span class="leader-avatar ${r.cls}">${r.av}</span><div><div class="leader-name">${esc(r.name)} ${r.name==='You'?'<span style="color:var(--lime)">✦</span>':''}</div><div class="leader-hint">${esc(r.handle)}</div></div><div class="leader-balance num">${money(r.bal)} RC<span>${money(r.open)} RC at risk</span></div></div>`).join('')}</div><div class="wide-card"><div class="section-head"><div><span class="overline">FRIEND ACTIVITY</span><h2 style="margin-top:7px">Latest calls</h2></div></div><div class="activity"><b>Kai</b> called the upset on a demo fixture at 3.30×.<span>Revealed after market lock · Sample activity</span></div><div class="activity"><b>Mika</b> picked a rare champion in Game 1.<span>Revealed after market lock · Sample activity</span></div><div class="activity">You joined the 2026 private league.<span>Opening grant: 1,000 RC</span></div></div><div class="wide-card"><span class="overline">END-OF-SEASON AWARDS</span><div class="insight-grid" style="margin:17px 0 0"><div class="insight"><span class="label">Biggest upset</span><strong style="font-size:17px">THE ORACLE</strong></div><div class="insight"><span class="label">Best accuracy</span><strong style="font-size:17px">THE ANALYST</strong></div><div class="insight"><span class="label">Highest final bank</span><strong style="font-size:17px">THE CHAMPION</strong></div><div class="insight"><span class="label">Biggest turnaround</span><strong style="font-size:17px">THE COMEBACK</strong></div></div></div>`}
  function profile(){const settled=state.tickets.filter(t=>t.state!=='OPEN');const profit=settled.reduce((a,t)=>a+(t.state==='WON'?t.returnRc:0)-t.stake,0);return `${topbar()}<header class="page-heading"><h1>Your clubhouse<span style="color:var(--lime)">.</span></h1><p>Virtual bank management, activity history, and demo controls.</p></header>${walletHero()}<div class="section-head"><div><h2>Performance snapshot</h2><p>Based on demo selections settled in this browser</p></div></div><div class="insight-grid"><div class="insight"><span class="label">Realized profit</span><strong class="num ${profit>=0?'positive':''}">${profit>=0?'+':''}${money(profit)} RC</strong></div><div class="insight"><span class="label">Prediction accuracy</span><strong>${settled.length?Math.round(100*settled.filter(t=>t.state==='WON').length/settled.length)+'%':'—'}</strong></div><div class="insight"><span class="label">Total grants</span><strong>${money(state.grants)} RC</strong></div><div class="insight"><span class="label">Open predictions</span><strong>${state.tickets.filter(t=>t.state==='OPEN').length}</strong></div></div><div class="wide-card"><div class="section-head"><div><h2>Wallet journal</h2><p>Newest transactions first · demo only</p></div></div>${state.ledger.slice().reverse().map(l=>`<div class="list-row"><div><strong>${esc(l.label)}</strong><div class="muted" style="margin-top:5px">${esc(l.when)}</div></div><strong class="num ${l.delta>=0?'positive':''}">${l.delta>=0?'+':''}${money(l.delta)} RC</strong></div>`).join('')}</div><div class="wide-card"><h2 style="font-size:17px;margin-bottom:9px">Demo controls</h2><p class="help">Use these to feel the grant-and-settlement loop. They are not production functionality.</p><div class="wallet-actions"><button class="secondary" data-demo-grant ${state.nextClaimed?'disabled':''}>${state.nextClaimed?'Next grant simulated ✓':'Simulate next match-day +1,000 RC'}</button><button class="secondary" data-reset-demo>Reset demo</button></div></div><p class="help">Play credits only. Nontransferable, nonredeemable, no prizes, no payment method. No affiliation with Riot Games. Policy clearance required before any LoL-branded deployment.</p>`}
  function renderMain(){const m=document.getElementById('main-view');m.innerHTML=({today,explore,picks,league,profile})[state.view]();renderNav();renderSlip()}
  function emptySlip(){return `<div class="rail-empty"><div class="empty-illustration">◇</div><b>A good call starts here.</b><p>Tap any odds tile to add a prediction to your slip. Your credits aren't spent until you confirm.</p></div><div style="margin-top:18px" class="demo-note">Independent singles, not a parlay. Potential returns are conditional on each result.</div>`}
  function slipMarkup(){const rows=validSlip();if(!rows.length)return emptySlip();const total=slipStake(),potential=slipPotential(),notEnough=total>state.available,bad=rows.some(([,s])=>!Number.isInteger(Number(s))||Number(s)<1);return `<div class="slip-scroll">${rows.map(([id,s])=>{const d=index.get(id);return `<article class="slip-item"><div class="slip-item-top"><div><div class="slip-title">${esc(d.m.label)} · ${esc(d.name)}</div><div class="slip-event">${esc(d.ev.a)} vs ${esc(d.ev.b)} · ${esc(d.m.cat)}</div></div><span class="slip-odds">${odds(d.odds)}</span></div><label class="slip-stake-label" for="stake-${id}">Stake · RC</label><div class="stake-row"><input id="stake-${id}" data-stake="${id}" type="number" min="1" step="1" inputmode="numeric" value="${esc(s)}" aria-label="Stake for ${esc(d.name)}" /><button class="tiny-remove" data-remove="${id}" aria-label="Remove ${esc(d.name)}">×</button></div><p class="slip-payout">If correct, <b class="num">${money(Number(s)*d.odds)} RC</b> total returned.</p></article>`}).join('')}</div><div class="quick-stakes"><button data-set-all="100">+100 each</button><button data-set-split="25">25%</button><button data-set-split="50">50%</button><button data-set-split="100">ALL</button></div><div class="slip-bottom"><div class="slip-rows"><div class="slip-total"><span>${rows.length} independent pick${rows.length===1?'':'s'} · Staked</span><strong class="num">${money(total)} RC</strong></div><div class="slip-total important"><span>If every pick wins</span><strong class="num">${money(potential)} RC</strong></div><div class="slip-total"><span>Net gain if all win</span><strong class="num">+${money(potential-total)} RC</strong></div><div class="slip-total"><span>Available after</span><strong class="num">${money(Math.max(0,state.available-total))} RC</strong></div></div>${notEnough?'<p class="status-feedback">Not enough available credits. Lower your stakes.</p>':''}${bad?'<p class="status-feedback">Each stake must be a positive whole number of RC.</p>':''}<button class="primary" data-place ${notEnough||bad||total<1?'disabled':''}>Place ${rows.length} pick${rows.length===1?'':'s'} →</button><p class="micro">Fictional credits only · demo odds locked on mock acceptance</p></div>`}
  function renderSlip(){const count=validSlip().length;document.getElementById('rail-counter').textContent=count;document.getElementById('rail-body').innerHTML=slipMarkup();document.getElementById('sheet-body').innerHTML=slipMarkup();const flo=document.getElementById('mobile-slip');flo.classList.toggle('hidden',!count||sheetOpen);flo.innerHTML=`<span>${count} PICK${count===1?'':'S'} · ${money(slipStake())} RC</span><span>Review slip →</span>`}
  function toggleSelection(id){const o=index.get(id);if(!o)return;if(Object.hasOwn(state.slip,id))delete state.slip[id];else{for(const k of Object.keys(state.slip))if(index.get(k)?.m.id===o.m.id)delete state.slip[k];state.slip[id]=100}persist();renderMain();if(state.slip[id]&&innerWidth<1000)toast('Added to your slip · '+o.name)}
  function setSheet(open){sheetOpen=open;document.getElementById('sheet').classList.toggle('show',open);document.getElementById('sheet-bg').classList.toggle('show',open);document.getElementById('sheet').setAttribute('aria-hidden',String(!open));document.getElementById('sheet-bg').setAttribute('aria-hidden',String(!open));document.body.style.overflow=open?'hidden':'';renderSlip();if(open)document.getElementById('close-sheet').focus();else document.getElementById('mobile-slip').focus()}
  function navigate(view){state.view=view;if(view!=='explore')state.category='All';persist();if(sheetOpen)setSheet(false);renderMain();window.scrollTo({top:0,behavior:'instant'});document.getElementById('main-view').focus({preventScroll:true})}
  function stakeChange(input){const id=input.dataset.stake;if(!Object.hasOwn(state.slip,id))return;const raw=input.value;state.slip[id]=raw===''?0:Math.max(0,Math.floor(Number(raw)||0));persist();const active=globalThis.document.activeElement;const selectionStart=typeof active.selectionStart==='number'?active.selectionStart:null;renderSlip();const replacement=document.getElementById((input.closest('#sheet')?'sheet':'rail')==='sheet'?'sheet':'rail-body')?.querySelector(`[data-stake="${id}"]`);if(replacement){replacement.focus();try{if(selectionStart!=null)replacement.setSelectionRange(selectionStart,selectionStart)}catch{}}}
  function quickSet(mode,value){const ids=Object.keys(state.slip);if(!ids.length)return;if(mode==='plus'){const each=Number(value);for(const id of ids)state.slip[id]=Number(state.slip[id]||0)+each}else{const pool=Math.floor(state.available*Number(value)/100);const share=Math.floor(pool/ids.length);ids.forEach((id,i)=>state.slip[id]=share+(i===ids.length-1?pool-share*ids.length:0))}persist();renderSlip()}
  function place(){const rows=validSlip(),sum=slipStake();if(!rows.length||sum>state.available||rows.some(([,s])=>!Number.isInteger(Number(s))||Number(s)<=0)){toast('Check your available balance and stakes.');return}const id='demo-'+Date.now();state.available-=sum;rows.forEach(([itemId,stake],i)=>state.tickets.push({ticketId:id+'-'+i,id:itemId,odds:index.get(itemId).odds,stake:Number(stake),when:'DEMO · '+new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}),state:'OPEN',returnRc:0}));state.ledger.push({id:id,label:`${rows.length} prediction${rows.length===1?'':'s'} placed`,delta:-sum,when:'Demo acceptance'});state.slip={};persist();if(sheetOpen)setSheet(false);state.pickFilter='OPEN';navigate('picks');toast(`Accepted ${rows.length} demo pick${rows.length===1?'':'s'} · ${money(sum)} RC staked`)}
  function grade(id,grade){const t=state.tickets.find(t=>t.ticketId===id);if(!t||t.state!=='OPEN')return;t.state=grade;t.returnRc=grade==='WON'?Math.round(t.stake*t.odds):0;if(t.returnRc){state.available+=t.returnRc;state.ledger.push({id:Date.now()+'-settle',label:'Demo winning prediction return',delta:t.returnRc,when:'Simulated settlement'})}else{state.ledger.push({id:Date.now()+'-loss',label:'Demo lost prediction (stake already spent)',delta:0,when:'Simulated settlement'})}persist();renderMain();toast(grade==='WON'?`Demo win! +${money(t.returnRc)} RC returned`:'Demo selection lost · no return')}
  function grant(){if(state.nextClaimed)return;state.nextClaimed=true;state.available+=1000;state.grants+=1000;state.ledger.push({id:'grant-next',label:'Next match-day demo grant',delta:1000,when:'Simulated future match day'});persist();renderMain();toast('Next match-day grant simulated: +1,000 RC')}
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view)navigate(b.dataset.view);else if(b.dataset.outcome)toggleSelection(b.dataset.outcome);else if(b.dataset.remove){delete state.slip[b.dataset.remove];persist();renderMain()}else if(b.dataset.filter){filter=b.dataset.filter;renderMain()}else if(b.dataset.category){state.category=b.dataset.category;persist();renderMain()}else if(b.dataset.goCategory){state.category=b.dataset.goCategory;navigate('explore');state.category=b.dataset.goCategory;persist();renderMain()}else if(b.dataset.event){state.category='All';navigate('explore')}else if(b.dataset.pickFilter){state.pickFilter=b.dataset.pickFilter;persist();renderMain()}else if(b.dataset.setAll)quickSet('plus',b.dataset.setAll);else if(b.dataset.setSplit)quickSet('split',b.dataset.setSplit);else if(Object.hasOwn(b.dataset,'place'))place();else if(b.dataset.settle)grade(b.dataset.settle,b.dataset.grade);else if(Object.hasOwn(b.dataset,'demoGrant'))grant();else if(Object.hasOwn(b.dataset,'resetDemo')){if(confirm('Reset your demo wallet and all fake predictions?')){state=initial();filter='All';persist();renderMain();toast('Demo reset')}}});
  document.addEventListener('change',e=>{const input=e.target.closest('input[data-stake]');if(input)stakeChange(input)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetOpen)setSheet(false)});
  document.getElementById('mobile-slip').addEventListener('click',()=>setSheet(true));
  document.getElementById('close-sheet').addEventListener('click',()=>setSheet(false));
  document.getElementById('sheet-bg').addEventListener('click',()=>setSheet(false));
  renderMain();
})();
</script>
</body>
</html>
