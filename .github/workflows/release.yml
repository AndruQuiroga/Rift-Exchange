name: Validate and publish
on:
  pull_request:
  push:
    branches: [ccr-6551a6f3-f8mlrn, main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rift
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: rift_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U rift" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RIFT_TEST_DATABASE_URL: postgresql+psycopg://rift:test-only@localhost:5432/rift_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.32'
          python-version: '3.13'
      - name: Backend tests and lint
        working-directory: services/api
        run: |
          uv sync --frozen
          uv run ruff check src tests
          uv run pytest -q
      - name: Fresh database migration rehearsal
        working-directory: services/api
        env:
          RIFT_DATABASE_URL: postgresql+psycopg://rift:test-only@localhost:5432/rift_migration
          PGPASSWORD: test-only
        run: |
          createdb -h localhost -U rift rift_migration
          uv run alembic upgrade head
          uv run alembic check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Frontend checks
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
      - name: Validate Swarm manifest and shell scripts
        env:
          API_IMAGE: ghcr.io/andruquiroga/rift-api:validation
          WEB_IMAGE: ghcr.io/andruquiroga/rift-web:validation
          RELEASE_ID: validation
          DATA_NODE: validation-data
          BACKUP_NODE: validation-backup
          INGRESS_NETWORK: validation-ingress
        run: |
          docker stack config -c infra/stache/stack.yml > /dev/null
          sh -n infra/stache/deploy.sh
          sh -n infra/stache/backup.sh

  images:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: services/api
          - name: web
            context: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/andruquiroga/rift-${{ matrix.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/AndruQuiroga/Rift-Exchange
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record image digest
        if: github.event_name != 'pull_request'
        run: echo 'ghcr.io/andruquiroga/rift-${{ matrix.name }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
